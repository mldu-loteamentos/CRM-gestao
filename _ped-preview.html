<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Pedidos</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    .fnf-pop { position: fixed; inset: 0; background: rgba(15,23,42,.35); display: flex; align-items: center; justify-content: center; }
    .fnf-pop-box { background: #fff; border-radius: 12px; }
    #env-busca-ped .fnf-pop-box { width: min(1180px, 96vw); max-height: 92vh; display: flex; flex-direction: column; padding: 18px 20px 16px; }
    #env-busca-lista { margin-top: 12px; overflow: auto; min-height: 420px; max-height: calc(92vh - 160px); }
    .env-ped-tab { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .env-ped-tab th { text-align: left; font-size: 0.68rem; text-transform: uppercase; color: #64748b; padding: 8px 10px; border-bottom: 1px solid #e2e8f0; }
    .env-ped-tab td { padding: 10px; border-bottom: 1px solid #f1f5f9; }
    .env-ped-tab .num { text-align: right; }
    .env-ped-tab tbody tr.env-ped-credor td { background: #f8fafc; font-weight: 700; color: #105436; }
  </style>
</head>
<body>
  <div id="env-busca-ped" class="fnf-pop">
    <div class="fnf-pop-box" id="box">
      <b>Pedidos em aberto</b>
      <p>Pesquise pelo credor. A lista traz os pedidos em aberto de todos os departamentos.</p>
      <div id="env-busca-lista">
        <table class="env-ped-tab">
          <thead><tr><th>Pedido</th><th>Data</th><th class="num">Valor</th><th>Departamento</th></tr></thead>
          <tbody>
            <tr class="env-ped-credor"><td colspan="4">FABIO FONSECA DE MOURA LEITE</td></tr>
            <tr><td><b>28235</b></td><td>22/07/2026</td><td class="num">42.654,00</td><td>ENGENHARIA</td></tr>
            <tr><td><b>29001</b></td><td>01/08/2026</td><td class="num">10.000,00</td><td>SUPRIMENTOS</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
